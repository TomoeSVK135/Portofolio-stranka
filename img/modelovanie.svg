<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description" class="interactive-card">
	<title id="title">Modelovanie sietí</title>
	<desc id="description">Geometrický model uzlov a logistických trás v redakčnom štýle.</desc>
	<style>
		.interactive-card .network-node,
		.interactive-card .center-hub {
			transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
			transform-origin: center;
		}
		.interactive-card .network-line {
			transition: all 0.4s ease;
		}
		.interactive-card:hover .center-hub { transform: scale(1.18); }
		.interactive-card:hover .network-node { transform: scale(1.25); }
		.interactive-card:hover .network-line-main { stroke-width: 4px; opacity: 1; }
	</style>
	<rect x="0" y="0" width="512" height="512" rx="32" fill="#292929"/>
	<text x="48" y="72" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">TOPOLÓGIA &amp; SMEROVANIE</text>
	<text x="48" y="104" fill="#FFFFFF" font-family="Georgia, serif" font-size="22" font-style="italic">Modelovanie sietí</text>
	<rect x="48" y="135" width="416" height="260" rx="18" fill="#FFF7F0" stroke="#292929" stroke-width="2.5"/>
	<path d="M88 200h336M88 265h336M88 330h336" stroke="#F0DFD1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
	<path class="network-line" d="M120 295 200 205 310 285 392 195" fill="none" stroke="#292929" stroke-width="2" opacity="0.4"/>
	<path class="network-line network-line-main" d="M120 295 256 265 392 195" fill="none" stroke="#F47B20" stroke-width="3" stroke-linecap="round"/>
	<path class="network-line" d="M200 205 256 265 310 285" fill="none" stroke="#FFB36B" stroke-width="2" opacity="0.9"/>
	<circle class="network-node" cx="120" cy="295" r="9" fill="#FFB36B" stroke="#292929" stroke-width="2.5"/>
	<circle class="network-node" cx="200" cy="205" r="9" fill="#FFB36B" stroke="#292929" stroke-width="2.5"/>
	<circle class="network-node" cx="310" cy="285" r="9" fill="#FFB36B" stroke="#292929" stroke-width="2.5"/>
	<circle class="network-node" cx="392" cy="195" r="9" fill="#FFB36B" stroke="#292929" stroke-width="2.5"/>
	<g class="center-hub">
		<circle cx="256" cy="265" r="17" fill="#F47B20" stroke="#292929" stroke-width="3"/>
		<circle cx="256" cy="265" r="5" fill="#FFF7F0"/>
	</g>
	<path d="M48 435h416" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="1.5" opacity="0.4"/>
	<text x="48" y="465" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">UZLY · TRASY · TEÓRIA GRAFOV</text>
	<circle cx="454" cy="461" r="6" fill="#FFB36B"/>
</svg>
